<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1c1f28"/>
  <!-- four strings -->
  <g stroke="#e8eaf0" stroke-linecap="round">
    <line x1="80" y1="176" x2="432" y2="176" stroke-width="10"/>
    <line x1="80" y1="232" x2="432" y2="232" stroke-width="13"/>
    <line x1="80" y1="288" x2="432" y2="288" stroke-width="16"/>
    <line x1="80" y1="344" x2="432" y2="344" stroke-width="19"/>
  </g>
  <!-- fret -->
  <line x1="256" y1="140" x2="256" y2="380" stroke="#8a90a3" stroke-width="10" stroke-linecap="round"/>
  <!-- a rising phrase -->
  <circle cx="150" cy="344" r="34" fill="#ffb648"/>
  <circle cx="230" cy="288" r="34" fill="#ffb648"/>
  <circle cx="300" cy="232" r="34" fill="#4cd88a"/>
  <circle cx="380" cy="176" r="34" fill="#ffb648"/>
</svg>
